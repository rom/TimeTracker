<?xml version="1.0" encoding="UTF-8"?>
<!-- A clock face, drawn in currentColor so it inherits the browser's own
     rendering rather than fighting the user's theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="13" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M16 8 v9 l6 4" fill="none" stroke="#2563eb" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
